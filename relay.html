<!DOCTYPE html><html><head><meta charset="utf-8"><title>relay</title></head><body>relay
<script>
(async()=>{const n=decodeURIComponent(location.hash.slice(1));
 try{const b=await fetch('v/'+n,{cache:'no-store'}).then(r=>r.blob());
 (window.opener||window.parent).postMessage({relay:1,name:n,blob:b},'*'); document.body.textContent='ok '+b.size;}
 catch(e){(window.opener||window.parent).postMessage({relay:1,name:n,err:String(e)},'*');}
})();
</script></body></html>
